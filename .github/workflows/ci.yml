# CI: the theme checks (npm test: theme.css built from the source, Obsidian's theme guidelines, contrast, Style
# Settings block, manifest and screenshot) on every push and pull request.
name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
